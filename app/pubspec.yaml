name: checkin
description: Check-In — a simple, private way to keep up with friends.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  dio: ^5.7.0
  http_parser: ^4.0.2
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1      # open the self-hosting setup guide on GitHub
  image_picker: ^1.2.3
  flutter_image_compress: ^2.3.0  # transcode HEIC→JPEG + downscale photos before upload
  video_player: ^2.9.2     # play a posted clip in the full-screen viewer (AVPlayer/ExoPlayer)
  video_compress: ^3.1.4   # re-encode a clip to a size target + read duration + poster frame
  native_exif: ^0.8.0      # read a picked photo's GPS (on-device)
  geocoding: ^5.0.0        # reverse-geocode lat/lng → "City, Country" (on-device)
  gal: ^2.3.0              # save a post's photo to the device gallery
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_contacts: ^2.2.2
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  intl: ^0.20.3
  firebase_core: ^4.11.0      # initialise Firebase from the native google-services config
  firebase_messaging: ^16.4.1 # FCM push: delivers to Android directly and iOS via APNs
  visibility_detector: ^0.4.0+2  # how much of a feed clip is on screen, for autoplay
  flutter_map: ^8.3.1
  flutter_map_marker_cluster: ^8.2.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Lets a test stand in for the platform video player, so feed autoplay can be asserted
  # on a host that has no player at all.
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/worldmap/world_outlines.bin
    - assets/worldmap/region_outlines.bin
    - assets/worldmap/detail_outlines.bin
