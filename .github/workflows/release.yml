name: Release

# Cuts a new version on every push to main: bumps the version from conventional
# commits, builds & publishes the server Docker image, builds the Flutter apps, creates
# a GitHub Release with the Android APK, and (when store secrets are present) deploys to
# the Play Store and App Store via fastlane.

on:
  push:
    branches: [main]

# No workflow-wide permissions at all. Every job below states exactly what it needs, so a
# step in an unrelated job - or an action compromised upstream - cannot push a package or a
# release just because the pipeline as a whole was allowed to. Read is not free either: it
# is what lets a job see the repository, so the jobs that only consume artifacts say so.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Gate the whole release on the same checks CI runs on PRs. ci.yml ignores main, so
  # without this a broken merge to main would publish + deploy untested. version (and
  # therefore every build/deploy job that needs it) only runs once these pass.
  test-server:
    name: Test server (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    # Same throwaway database as ci.yml, for the same reason: without TESTDB_URL the
    # DB-backed handler tests skip, and a release must not be gated on a suite that quietly
    # ran nothing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: checkin
          # Not a secret - the database lives and dies inside this job - but a literal
          # here trips secret scanners on every future edit; a per-run value does not.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
          POSTGRES_DB: checkin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - name: Check formatting (gofmt)
        run: test -z "$(gofmt -l .)" || { echo 'These files need gofmt:'; gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race
        env:
          TESTDB_URL: postgres://checkin:ci-${{ github.run_id }}@localhost:5432/checkin_test?sslmode=disable

  test-app:
    name: Test app (Flutter)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Check formatting (dart format)
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  version:
    name: Compute version
    needs: [test-server, test-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the release tag
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      new_version: ${{ steps.tag.outputs.new_version }}
      changelog: ${{ steps.tag.outputs.changelog }}
      has_play: ${{ steps.secrets.outputs.has_play }}
      has_appstore: ${{ steps.secrets.outputs.has_appstore }}
      has_keystore: ${{ steps.secrets.outputs.has_keystore }}
      build_number: ${{ steps.build.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Compute build number
        id: build
        # Expression syntax has no arithmetic, so derive a single monotonic build number
        # (run_number * 100 + run_attempt) in the shell and share it via an output.
        run: echo "build_number=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))" >> "$GITHUB_OUTPUT"
      # A feature release must ship an update log. The What's New sheet only shows what the
      # curated list in release_notes.dart contains, and it silently starved for six releases
      # once nobody remembered to feed it. Predict the bump the tag action is about to make
      # (same rules: feat -> minor, BREAKING -> major, else patch) and refuse a minor/major
      # release whose MAJOR.MINOR has no matching entry. Patch releases pass freely - fixes
      # do not owe a changelog, and blocking hotfixes on prose would be worse. Runs before
      # the tag step so a refusal strands nothing.
      - name: Require release notes for a feature release
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          log=$(git log --format='%s%n%b' "$last"..HEAD)
          major=$(echo "$last" | sed 's/^v//' | cut -d. -f1)
          minor=$(echo "$last" | sed 's/^v//' | cut -d. -f2)
          if echo "$log" | grep -qE '^BREAKING CHANGE|^[a-z]+(\([^)]*\))?!:'; then
            major=$((major+1)); minor=0
          elif echo "$log" | grep -qE '^feat(\([^)]*\))?:'; then
            minor=$((minor+1))
          else
            echo "patch release: no notes required"; exit 0
          fi
          want="$major.$minor"
          have=$(grep -m1 "version: '" app/lib/features/whats_new/release_notes.dart | sed "s/.*version: '\([^']*\)'.*/\1/")
          if [ "$have" != "$want" ]; then
            echo "::error::This release bumps to $want but the newest What's New entry is '$have'."
            echo "::error::Members who update will see no changelog. Add a ReleaseNote(version: '$want', ...) to app/lib/features/whats_new/release_notes.dart."
            exit 1
          fi
          echo "release notes present for $want"
      # Tagged with plain git rather than a third-party action: the action this replaces
      # started failing with "Not Found" the moment GitHub force-migrated it off Node 20,
      # which stopped a release that was otherwise green. The bump rules below are the same
      # conventional-commit rules the notes gate above predicts with, so the gate can never
      # disagree with what actually gets tagged.
      - name: Bump version and tag
        id: tag
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          log=$(git log --format='%s%n%b' "$last"..HEAD)
          major=$(echo "$last" | sed 's/^v//' | cut -d. -f1)
          minor=$(echo "$last" | sed 's/^v//' | cut -d. -f2)
          patch=$(echo "$last" | sed 's/^v//' | cut -d. -f3)
          if echo "$log" | grep -qE '^BREAKING CHANGE|^[a-z]+(\([^)]*\))?!:'; then
            major=$((major+1)); minor=0; patch=0
          elif echo "$log" | grep -qE '^feat(\([^)]*\))?:'; then
            minor=$((minor+1)); patch=0
          else
            patch=$((patch+1))
          fi
          version="$major.$minor.$patch"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists. A release for it either succeeded or was tagged by hand."
            exit 1
          fi
          {
            echo "new_version=$version"
            echo "new_tag=$tag"
            echo "changelog<<RELEASE_CHANGELOG"
            git log --format='- %s' "$last"..HEAD
            echo "RELEASE_CHANGELOG"
          } >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
          echo "tagged $tag (previous $last)"
      - name: Detect store secrets
        id: secrets
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          IOS_CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "has_play=$([ -n "$PLAY_JSON" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_appstore=$([ -n "$IOS_CERT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_keystore=$([ -n "$KEYSTORE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  docker:
    name: Build & push server image
    needs: version
    if: needs.version.outputs.new_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pushes the image to ghcr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/nc1107/check-in:latest
            ghcr.io/nc1107/check-in:${{ needs.version.outputs.new_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    name: Build Android
    needs: version
    if: needs.version.outputs.new_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - name: Decode signing keystore
        if: needs.version.outputs.has_keystore == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/android/app/upload-keystore.jks
          printf '%s' "$KEY_PROPERTIES" > app/android/key.properties
      - working-directory: app
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name=${{ needs.version.outputs.new_version }} \
            --build-number=${{ needs.version.outputs.build_number }}
          flutter build appbundle --release \
            --build-name=${{ needs.version.outputs.new_version }} \
            --build-number=${{ needs.version.outputs.build_number }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android
          retention-days: 7
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab

  release:
    name: GitHub Release
    needs: [version, docker, android]
    if: needs.version.outputs.new_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android
          path: ./artifacts
      - uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: ${{ needs.version.outputs.new_tag }}
          body: ${{ needs.version.outputs.changelog }}
          files: ./artifacts/**/*.apk

  # --- Store deploys (run only when the corresponding secrets are configured) ---

  play-store:
    name: Deploy to Play Store
    needs: [version, android]
    if: >
      needs.version.outputs.has_play == 'true' &&
      needs.version.outputs.new_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: app
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/android/app/upload-keystore.jks
          printf '%s' "$KEY_PROPERTIES" > app/android/key.properties
      - name: Deploy (internal track)
        working-directory: app
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION: ${{ needs.version.outputs.new_version }}
          VERSION_CODE: ${{ needs.version.outputs.build_number }}
        run: bundle exec fastlane android internal

  app-store:
    name: Build & upload iOS to TestFlight
    needs: [version]
    if: >
      needs.version.outputs.has_appstore == 'true' &&
      needs.version.outputs.new_tag != ''
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Cache pub-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
            app/.dart_tool
          key: ${{ runner.os }}-pubcache-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pubcache-
      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            app/ios/Pods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pods-
      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - name: Install CocoaPods
        run: gem install cocoapods
      - name: Set up code signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< \
            $(security cms -D -i "$PP_PATH"))
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision
      - name: Set up App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Build IPA
        working-directory: app
        run: |
          # Disable Flutter's experimental Swift Package Manager integration so every iOS
          # plugin (Firebase, app_links, …) links via CocoaPods (flutter_install_all_ios_pods
          # in the Podfile) - the stable path 1.0 shipped on. SPM's linking left the app stuck
          # on a white launch screen (Firebase's grpc native init trapped before runApp).
          flutter config --no-enable-swift-package-manager
          flutter pub get
          flutter build ipa --release \
            --build-name=${{ needs.version.outputs.new_version }} \
            --build-number=${{ needs.version.outputs.build_number }} \
            --export-options-plist=ios/ExportOptions.plist
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(find app/build/ios -name "*.ipa" | head -1)
          xcrun altool --upload-app \
            -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --show-progress
