name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # Throwaway database for the DB-backed handler tests, which are most of the suite.
    # Without TESTDB_URL those tests refuse to run rather than skipping (see
    # internal/api/main_test.go's requireTestDB), so this service container is what makes
    # the job meaningful rather than merely green. Locally, server/scripts/test.sh sets up
    # the same thing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: checkin
          # Not a secret - the database lives and dies inside this job - but a literal
          # here trips secret scanners on every future edit; a per-run value does not.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
          POSTGRES_DB: checkin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - name: Check formatting (gofmt)
        run: test -z "$(gofmt -l .)" || { echo 'These files need gofmt:'; gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race
        env:
          TESTDB_URL: postgres://checkin:ci-${{ github.run_id }}@localhost:5432/checkin_test?sslmode=disable

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Check formatting (dart format)
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
