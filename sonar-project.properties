# SonarCloud runs here as Automatic Analysis; this file exists only to scope one rule.
#
# pythonsecurity:S8707 ("LLMs running this code with faulty CLI arguments can escape file
# system restrictions") fires on server/scripts/normalize_locations.py, where --cities and
# --countries are opened from argv. The rule wants the resolved path constrained to an
# allowed base directory.
#
# That constraint is wrong for this file. It is a maintenance script an operator runs by
# hand against their own group's database, with that database's credentials already in
# their possession, to read a GeoNames export they downloaded themselves - so the path has
# to be allowed to point wherever they unzipped it. Pinning it to a base directory would
# break the documented usage and protect nothing: anyone who can pass --cities can already
# pass --database-url. The script does resolve each path and refuse anything that is not a
# readable file (see readable_file), which is the check that has real value here - it turns
# a mistyped argument into a clear error instead of a stack trace.
#
# Scoped to that one rule in that one file on purpose. Everything else, including the rest
# of server/scripts, stays analyzed.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e1.resourceKey=server/scripts/normalize_locations.py
